<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2E6; --surface:#F8FBF3; --surface2:#E2EBD6; --line:#CBD9BC;
  --text:#21301C; --muted:#56684E; --sage:#8FAE7A; --deep:#4B6840;
  --hero:#B4CA9E; --hero-text:#1D2B18; --btn:#4B6840; --btn-text:#FFFFFF;
  --ok:#6E9557; --warn:#D2AE5A; --over:#B8664F; --danger:#A4513C;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A11; --surface:#1C2719; --surface2:#26331F; --line:#34452D;
    --text:#E4EDDB; --muted:#A3B598; --sage:#8FAE7A; --deep:#9CBA86;
    --hero:#2D3C27; --hero-text:#E4EDDB; --btn:#9CBA86; --btn-text:#13200E;
    --ok:#86AE6F; --warn:#D2AE5A; --over:#D0806A; --danger:#E0917C;
  }
}
:root[data-theme="dark"]{
  --bg:#131A11; --surface:#1C2719; --surface2:#26331F; --line:#34452D;
  --text:#E4EDDB; --muted:#A3B598; --sage:#8FAE7A; --deep:#9CBA86;
  --hero:#2D3C27; --hero-text:#E4EDDB; --btn:#9CBA86; --btn-text:#13200E;
  --ok:#86AE6F; --warn:#D2AE5A; --over:#D0806A; --danger:#E0917C;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 96px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 6px}
.bar1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.months{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.mtab:hover{background:var(--surface2)}
.mtab[aria-pressed="true"]{background:var(--surface2);border-color:var(--deep);color:var(--text)}
.yrlab{flex:0 0 auto;font-family:var(--serif);font-weight:600;font-size:17px;padding:0 4px;align-self:center}
.mtab.yr{font-size:18px;padding:4px 10px}
.mtab.now::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage)}
.hist{display:grid;grid-template-columns:110px 1fr 60px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hist:first-of-type{border-top:0}
.hist:hover{background:var(--surface2)}
.hist .pc{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:620px){.hist{grid-template-columns:90px 1fr 50px}}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.saving i{background:var(--warn)}
.status.local i{background:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14.5px;white-space:nowrap;flex:0 0 auto}
.tab[aria-current="page"]{background:var(--deep);border-color:var(--deep);color:var(--btn-text)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--btn-text)}

/* generic */
main{padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;gap:16px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.three{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:720px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr 1fr}}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.sp{flex:1}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-text);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:42px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--deep);font-weight:600;text-decoration:underline;text-underline-offset:3px}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:disabled{background:var(--surface2);color:var(--muted)}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
label.f>span{color:var(--muted);font-weight:500}
.money{position:relative}
.money>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money>input{padding-left:26px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* hero */
.hero{background:var(--hero);color:var(--hero-text);border-radius:26px;padding:26px 24px 22px}
.hero .lbl{font-size:15px;font-weight:500;opacity:.85}
.hero .big{font-family:var(--serif);font-size:clamp(46px,10vw,72px);line-height:1.02;font-weight:600;letter-spacing:-.03em;margin:4px 0 6px}
.hero .big.neg{color:#8A3F2B}
:root[data-theme="dark"] .hero .big.neg{color:#E7A18E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .big.neg{color:#E7A18E}}
.hero .sub{font-size:15px;max-width:52ch}
.herostats{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid rgba(30,45,25,.18)}
:root[data-theme="dark"] .herostats{border-top-color:rgba(228,237,219,.18)}
.herostats b{display:block;font-family:var(--serif);font-size:22px;font-weight:600}
.herostats span{font-size:13.5px;opacity:.85}

/* bars */
.lines{display:grid;gap:14px}
.ln .top2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.ln .nm{font-weight:600}
.ln .amt{font-size:14px;color:var(--muted)}
.bar{position:relative;height:10px;background:var(--surface2);border-radius:99px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);min-width:0}
.bar.close>i{background:var(--warn)}
.bar.over>i{background:var(--over)}
.bar.goal>i{background:var(--deep)}
.bar .tick{position:absolute;top:-4px;width:2px;height:18px;border-radius:2px;background:var(--text);opacity:.5}
.ln .st{font-size:13px;color:var(--muted);margin-top:5px}
.ln .st.over{color:var(--over);font-weight:600}
.legend{font-size:13px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:8px}
.legend .tk{display:inline-block;width:2px;height:14px;background:var(--text);opacity:.5;border-radius:2px}

/* add purchase */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.catbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px;text-align:left;min-height:46px}
.catbtn i{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.catbtn:hover{background:var(--surface2)}
.catbtn[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--btn-text)}
.catbtn[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--btn-text)}
.addrow{display:grid;grid-template-columns:130px 1fr 150px auto auto;gap:10px;align-items:end}
@media (max-width:820px){.addrow{grid-template-columns:1fr 1fr}.addrow .full{grid-column:1/-1}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:42px}
.seg button{border:0;background:transparent;padding:0 16px;font-weight:600;flex:1}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--btn-text)}
.msg{min-height:20px;font-size:14px;color:var(--danger);margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--surface2);border-color:var(--deep)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}

/* tx list */
.day{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);padding:0 4px 6px}
.txbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;text-align:left}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface2)}
.dot{width:12px;height:12px;border-radius:50%}
.txmain{display:grid;min-width:0}
.txdesc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txcat{font-size:13px;color:var(--muted)}
.txamt{font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.pill{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.need{background:transparent;border:1px solid var(--line)}
@media (max-width:520px){.tx{grid-template-columns:auto 1fr auto;}.tx .pill{display:none}}

/* budget edit */
.lrow{display:grid;grid-template-columns:1.3fr 130px 150px 1.4fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
@media (max-width:820px){.lrow{grid-template-columns:1fr 1fr}.lrow .l-note,.lrow .l-name{grid-column:1/-1}}
.autochk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);grid-column:1/-1}
.autochk input{width:auto;min-height:0}
.sumrow{display:flex;gap:26px;flex-wrap:wrap}
.sumrow b{display:block;font-family:var(--serif);font-size:24px;font-weight:600}
.sumrow span{font-size:13.5px;color:var(--muted)}
.crow{display:grid;grid-template-columns:1.2fr 1.2fr 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:720px){.crow{grid-template-columns:1fr 1fr}}
.crow .dot{margin-right:2px}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:38px;height:38px;color:var(--danger);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--surface2)}

/* debt */
table.dt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dt th{text-align:right;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line)}
.dt tr.clickable{cursor:pointer}
.dt tr.clickable:hover td{background:var(--surface2)}
.dt td.end{font-weight:700}
.tablewrap{overflow-x:auto}
.debtform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
@media (max-width:720px){.debtform{grid-template-columns:1fr 1fr}.debtform .btn{grid-column:1/-1}}
.bigbal{font-family:var(--serif);font-size:clamp(38px,8vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1}

/* members */
.mgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mem{display:grid;gap:10px;align-content:start}
.mem .logo{width:52px;height:52px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--deep);overflow:hidden;flex:0 0 auto}
.mem .logo img{width:100%;height:100%;object-fit:cover;display:block}
.mem h3{font-size:18px}
.mem .price{font-weight:600}
.mem .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* track */
.ringwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:0 0 auto}
.ring .rtrack{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .rfill{fill:none;stroke:var(--ok);stroke-width:12;stroke-linecap:round}
.ring.mid .rfill{stroke:var(--warn)}
.ring.bad .rfill{stroke:var(--over)}
.ring .rnum{font-family:var(--serif);font-size:34px;font-weight:600;fill:var(--text)}
.verdict{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em}
.trow{display:grid;grid-template-columns:1.2fr 2fr 56px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .pc{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.trow .sm{font-size:13px;color:var(--muted)}
@media (max-width:620px){.trow{grid-template-columns:1fr 50px}.trow .bar{grid-column:1/-1;order:3}}
.bar.sc>i{background:var(--ok)}
.bar.sc.mid>i{background:var(--warn)}
.bar.sc.bad>i{background:var(--over)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .pace{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5;fill:none}
svg.chart .act{stroke:var(--deep);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg.chart .area{fill:var(--sage);opacity:.22}

/* feedback */
.fb{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fb li{padding-left:18px;position:relative;line-height:1.5}
.fb li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.fbcol.bad .fb li::before{background:var(--over)}
.fbcol.try .fb li::before{background:var(--warn)}
.banner{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14.5px}

/* dialog + toast */
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,460px);background:var(--surface);color:var(--text);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(20,32,16,.5)}
.dform{display:grid;gap:14px;padding:22px}
.dact{display:flex;gap:8px;align-items:center;margin-top:4px}
.logoedit{display:flex;gap:12px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--deep);color:var(--btn-text);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar1">
      <h1 class="brand">My budget</h1>
      <div class="status" id="status" role="status"><i></i><span>Loading</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="log">Spending log</button>
      <button class="tab" data-tab="budget">Budget</button>
      <button class="tab" data-tab="debt">Card debt</button>
      <button class="tab" data-tab="members">Memberships</button>
      <button class="tab" data-tab="track">On track</button>
      <button class="tab" data-tab="feedback">Monthly feedback</button>
    </nav>
    <div class="months" id="months" role="group" aria-label="Choose month"></div>
  </header>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const money=(n,d)=>{n=+n||0;d=d==null?2:d;const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return (n<0&&r2(n)!==0?'-$':'$')+s;};
const pct=n=>Math.round(n)+'%';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const monthLabel=mk=>{const p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});};
const monthShort=mk=>{const p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'long'});};
const daysIn=mk=>{const p=mk.split('-');return new Date(+p[0],+p[1],0).getDate();};
const shiftMonth=(mk,d)=>{const p=mk.split('-');const dt=new Date(+p[0],+p[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1);};
const dayLabel=ds=>{const p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});};
function progressOf(mk){const t=todayStr().slice(0,7);if(mk<t)return 1;if(mk>t)return 0;return Math.min(1,new Date().getDate()/daysIn(mk));}
function cleanUrl(u){u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:'';}catch(e){return'';}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}

/* ---------- defaults ---------- */
const PALETTE=['#7C9A5E','#C08A5B','#8B7CB0','#5E9AA0','#C77B7B','#B3A05A','#6F8FBF','#A6708F','#8CA84A','#D19A66','#5C8F7A','#9A8C7A'];
function defaultLines(){return[
 {id:'student',name:'Student debt',group:'essentials',kind:'limit',planned:150,note:''},
 {id:'food',name:'Groceries and food',group:'essentials',kind:'limit',planned:300,note:''},
 {id:'transport',name:'Transportation (Uber)',group:'essentials',kind:'limit',planned:150,note:''},
 {id:'dad',name:'Pay Dad',group:'essentials',kind:'limit',planned:100,note:'Spotify and other shared bills'},
 {id:'coursera',name:'Coursera',group:'essentials',kind:'limit',planned:0,note:''},
 {id:'bills',name:'Other required bills',group:'essentials',kind:'limit',planned:30,note:'Housing insurance'},
 {id:'card',name:'Credit card payment',group:'goals',kind:'goal',planned:650,note:'Aggressive starter target while rent-free. Prioritize high-interest debt.',locked:true},
 {id:'canada',name:'Canada trip fund',group:'goals',kind:'goal',planned:300,note:'December Canada fund. Adjust to your actual target.'},
 {id:'emergency',name:'Emergency savings',group:'goals',kind:'goal',planned:200,note:'Emergency cushion.'},

const LS_KEY='sage-budget-v1';
let S=defaultState(), month=todayStr().slice(0,7), tab='overview', logFilter='all';
let PL=S;
let draft={cat:null,nw:'want'};
let dbApi=null, base='', synced={}, saveTimer=null, saving=false, pending=false, cloud=false;

function setStatus(k){
 const el=$('#status');if(!el)return;
 el.className='status '+(k==='saving'?'saving':(k==='local'?'local':''));
 el.lastElementChild.textContent=k==='saving'?'Saving':(k==='local'?'Saved on this device':'Saved');
}
function splitDocs(st){
 const docs={
  core:{v:1,updatedAt:st.updatedAt,income:st.income,lines:st.lines,cats:st.cats,debt:st.debt,notes:st.notes,snaps:st.snaps},
  members:{items:st.members}
 };
 const by={};
 st.tx.forEach(t=>{const m=String(t.date).slice(0,7);(by[m]=by[m]||[]).push(t);});
 Object.keys(by).forEach(m=>{docs['tx-'+m]={items:by[m]};});
 return docs;
}
async function flush(){
 if(!cloud||!dbApi)return;
 if(saving){pending=true;return;}
 saving=true;setStatus('saving');
 try{
  do{
   pending=false;
   const docs=splitDocs(S);
   const ids=new Set(Object.keys(docs).concat(Object.keys(synced).filter(k=>k.indexOf('tx-')===0)));
   for(const id of ids){
    const ref=dbApi.doc(base+'/'+id);
    if(docs[id]){
     const j=JSON.stringify(docs[id]);
     if(synced[id]!==j){await ref.set(JSON.parse(j));synced[id]=j;}
    }else if(synced[id]!==undefined){await ref.delete();delete synced[id];}
   }
  }while(pending);
  setStatus('saved');
 }catch(e){setStatus('local');}
 saving=false;
}
function commit(){
 S.updatedAt=Date.now();
 try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
 if(cloud){setStatus('saving');clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);}
 else setStatus('local');
}
function assemble(r){
 const s=Object.assign(defaultState(true),r.core);
 s.members=(r.members&&r.members.items)||[];
 s.tx=[];
 Object.keys(r).forEach(k=>{if(k.indexOf('tx-')===0)(r[k].items||[]).forEach(t=>s.tx.push(t));});
 return migrate(s);
}
async function boot(){
 let cache=null;
 try{cache=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){}
 S=(cache&&cache.lines)?migrate(cache):defaultState();
 ensureSnaps();
 renderAll();
 setStatus('local');
 if(!(window.claude&&window.claude.use))return;
 try{
  const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  const db=res[0],user=res[1];
  if(!db||!user)return;
  const id=await user.id();
  if(!id)return;
  base='data/users/'+id;
  const snap=await db.collection(base).get();
  const remote={};
  snap.docs.forEach(d=>{remote[d.id]=JSON.parse(JSON.stringify(d.data()));});
  dbApi=db;cloud=true;
  Object.keys(remote).forEach(k=>{synced[k]=JSON.stringify(remote[k]);});
  if(remote.core){
   const rs=assemble(remote);
   if(!cache||(rs.updatedAt||0)>=(cache.updatedAt||0)){
    S=rs;ensureSnaps();try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
    renderAll();setStatus('saved');
   }else{flush();}
  }else{
   if(!S.updatedAt)S.updatedAt=Date.now();
   flush();
  }
 }catch(e){cloud=false;setStatus('local');}
}

const MK=/^\d{4}-\d{2}$/;
function dataMonths(){
 const set=new Set();
 S.tx.forEach(t=>{const m=String(t.date).slice(0,7);if(MK.test(m))set.add(m);});
 S.debt.rows.forEach(r=>{const m=String(r.date).slice(0,7);if(MK.test(m))set.add(m);});
 return Array.from(set).sort();
}
function monthList(){
 const cur=todayStr().slice(0,7);
 const set=new Set(dataMonths());set.add(cur);set.add(shiftMonth(cur,1));if(MK.test(month))set.add(month);
 const arr=Array.from(set).sort();
 const out=[];let m=arr[0],guard=0;
 while(m<=arr[arr.length-1]&&guard++<120){out.push(m);m=shiftMonth(m,1);}
 return out;
}
function ensureSnaps(){
 const cur=todayStr().slice(0,7);let ch=false;
 if(!S.snaps)S.snaps={};
 dataMonths().forEach(m=>{

/* ---------- model ---------- */
const lineById=id=>PL.lines.find(l=>l.id===id);
const catById=id=>PL.cats.find(c=>c.id===id);
function planFor(mk){return (S.snaps&&S.snaps[mk])||S;}
function statsFor(mk){const prev=PL;PL=planFor(mk);try{return stats(mk);}finally{PL=prev;}}
function grossMonthly(){const i=PL.income;return r2((+i.hourly||0)*(+i.hours||0)*52/12);}
function takeHome(){const i=PL.income;if(i.override!==null&&i.override!==''&&i.override!==undefined)return r2(i.override);return r2(grossMonthly()*(1-(+i.withhold||0)/100));}
function planned(l){
 if(l.auto){const others=PL.lines.reduce((a,x)=>a+(x===l||x.auto?0:(+x.planned||0)),0);return r2(takeHome()-others);}
 return r2(l.planned);
}
function lineOfTx(t){
 const c=catById(t.cat);
 let l=c?lineById(c.line):null;
 if(!l)l=lineById('flex')||PL.lines[0]||null;
 return l;
}
function stats(mk){
 const prog=progressOf(mk);
 const txs=S.tx.filter(t=>String(t.date).indexOf(mk)===0);
 const spent={};PL.lines.forEach(l=>{spent[l.id]=0;});
 txs.forEach(t=>{const l=lineOfTx(t);if(l)spent[l.id]=r2(spent[l.id]+(+t.amount||0));});
 const cardPaid=S.debt.rows.filter(r=>String(r.date).indexOf(mk)===0).reduce((a,r)=>a+(+r.payment||0),0);
 if('card' in spent)spent.card=r2(spent.card+cardPaid);
 const rows=PL.lines.map(l=>{
  const p=Math.max(0,planned(l));const a=spent[l.id];
  let score,status;
  if(l.kind==='goal'){
   const exp=p*prog;
   score=p===0?null:((exp<=0||a>=exp)?100:a/exp*100);
   status=a>=p&&p>0?'done':(a>=exp?'ok':'behind');
  }else{
   score=p===0?(a>0?0:null):(a<=p?100:Math.max(0,100-(a-p)/p*100));
   status=a>p?'over':(a>p*0.85&&p>0?'close':'ok');
  }
  const w=l.kind==='goal'?p:Math.max(p,a);
  return{l:l,p:p,a:a,score:score,status:status,w:w};
 });
 const avg=arr=>{const u=arr.filter(r=>r.score!=null&&r.w>0);const W=u.reduce((a,r)=>a+r.w,0);return W>0?u.reduce((a,r)=>a+r.w*r.score,0)/W:null;};
 const limitRows=rows.filter(r=>r.l.kind==='limit'),goalRows=rows.filter(r=>r.l.kind==='goal');
 const spendTx=txs.filter(t=>{const l=lineOfTx(t);return l&&l.kind==='limit';});
 return{
  mk:mk,prog:prog,txs:txs,rows:rows,limitRows:limitRows,goalRows:goalRows,spendTx:spendTx,
  overall:avg(rows),spendScore:avg(limitRows),goalScore:avg(goalRows),
  limitPlanned:r2(limitRows.reduce((a,r)=>a+r.p,0)),
  limitSpent:r2(limitRows.reduce((a,r)=>a+r.a,0)),
  goalDone:r2(goalRows.reduce((a,r)=>a+r.a,0)),
  wants:r2(spendTx.filter(t=>t.nw==='want').reduce((a,t)=>a+t.amount,0)),
  needs:r2(spendTx.filter(t=>t.nw!=='want').reduce((a,t)=>a+t.amount,0))
 };
}
function debtRows(){
 const rows=S.debt.rows.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||((a.ts||0)-(b.ts||0)));
 let bal=+S.debt.start||0;
 return rows.map(r=>{const start=r2(bal);const end=r2(start-(+r.payment||0)+(+r.interest||0));bal=end;return Object.assign({},r,{start:start,end:end});});
}
function debtBalance(){const d=debtRows();return d.length?d[d.length-1].end:r2(S.debt.start);}

function fileToLogo(file){
 return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej();
  fr.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const N=96,c=document.createElement('canvas');c.width=c.height=N;
    const x=c.getContext('2d');const s=Math.min(img.width,img.height)||N;
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N);
    res(c.toDataURL('image/webp',0.85));
   };
   img.onerror=()=>rej();
   img.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}

/* ---------- On track ---------- */
function scoreClass(s){return s>=80?'':(s>=60?'mid':'bad');}
function ring(score){
 const R=54,C=2*Math.PI*R,s=score==null?0:score,off=C*(1-s/100);
 return '<svg viewBox="0 0 140 140" class="ring '+scoreClass(s)+'" role="img" aria-label="'+Math.round(s)+' percent on budget"><circle cx="70" cy="70" r="'+R+'" class="rtrack"/><circle cx="70" cy="70" r="'+R+'" class="rfill" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 70 70)"/><text x="70" y="79" text-anchor="middle" class="rnum">'+Math.round(s)+'%</text></svg>';
}
function paceChart(st){
 const dim=daysIn(st.mk),cap=st.limitPlanned;
 const daily=new Array(dim).fill(0);
 st.spendTx.forEach(t=>{const d=parseInt(String(t.date).slice(8,10),10);if(d>=1&&d<=dim)daily[d-1]+=t.amount;});
 const cur=todayStr().slice(0,7);
 const upto=st.mk<cur?dim:(st.mk===cur?new Date().getDate():0);
 const cum=[];let run=0;for(let i=0;i<dim;i++){run+=daily[i];cum.push(run);}
 const mx=Math.max(cap,run,1)*1.08;
 const W=640,H=230,L=46,R=14,T=14,B=28;
 const X=d=>L+(d-1)/(Math.max(dim-1,1))*(W-L-R),Y=v=>T+(1-v/mx)*(H-T-B);
 let pts='';for(let d=1;d<=upto;d++)pts+=(d===1?'M':'L')+X(d).toFixed(1)+' '+Y(cum[d-1]).toFixed(1)+' ';
 let area='';if(upto>0)area=pts+'L'+X(upto).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(1).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
 let g='';[0,0.5,1].forEach(f=>{const v=mx/1.08*f;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+money(v,0)+'</text>';});
 const xl=[1,Math.round(dim/4),Math.round(dim/2),Math.round(dim*3/4),dim];
 xl.forEach(d=>{g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d+'</text>';});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending this month compared with an even pace">'+g
  +'<path class="pace" d="M'+X(1).toFixed(1)+' '+Y(cap/dim).toFixed(1)+' L'+X(dim).toFixed(1)+' '+Y(cap).toFixed(1)+'"/>'
  +(area?'<path class="area" d="'+area+'"/><path class="act" d="'+pts+'"/>':'')+'</svg>';
}

/* ---------- Feedback ---------- */
function feedback(mk){
 const st=stats(mk),prog=st.prog;
 const wins=[],misses=[],tries=[];
 const txs=st.txs,spendTx=st.spendTx;
 if(!txs.length&&!S.debt.rows.some(r=>String(r.date).indexOf(mk)===0))return{st:st,wins:wins,misses:misses,tries:tries,empty:true};
 const cur=todayStr().slice(0,7);
 const flex=st.rows.find(r=>r.l.id==='flex');
 const flexP=flex?flex.p:0;
 // over limits
 st.limitRows.filter(r=>r.status==='over').sort((a,b)=>(b.a-b.p)-(a.a-a.p)).forEach(r=>{
  const big=txs.filter(t=>lineOfTx(t)===r.l).sort((a,b)=>b.amount-a.amount)[0];
  const lead=r.p>0?'<b>'+esc(r.l.name)+'</b> ran '+money(r.a-r.p)+' over, which is '+pct(r.a/r.p*100)+' of the '+money(r.p)+' you set.':'<b>'+esc(r.l.name)+'</b> had '+money(r.a)+' of spending with nothing budgeted.';
  misses.push(lead+(big?' The biggest charge was '+esc(big.desc)+' at '+money(big.amount)+'.':''));
 });
 if(flex&&flex.status==='over'&&flex.p>0)misses.push('That extra '+money(flex.a-flex.p)+' of fun spending is money that was meant for your card or your Canada fund. It does not disappear, it just shows up later as debt or a smaller trip.');
 // repeat merchants
 const groups={};
 spendTx.forEach(t=>{const k=norm(t.desc);if(!k)return;const g=groups[k]||(groups[k]={name:t.desc,n:0,sum:0});g.n++;g.sum+=t.amount;});
 Object.keys(groups).map(k=>groups[k]).filter(g=>g.n>=3).sort((a,b)=>b.sum-a.sum).slice(0,3).forEach(g=>{
  misses.push('<b>'+esc(g.name)+'</b> showed up '+g.n+' times for '+money(g.sum)+' in total. Lots of smaller charges are much easier to lose track of than one purchase.');
 });
 // big single purchases
 if(flexP>0){
  spendTx.filter(t=>{const l=lineOfTx(t);return l&&l.id==='flex'&&t.amount>=flexP*0.4;}).sort((a,b)=>b.amount-a.amount).slice(0,2).forEach(t=>{
   misses.push('<b>'+esc(t.desc)+'</b> on '+dayLabel(t.date)+' was '+money(t.amount)+' by itself, about '+pct(t.amount/flexP*100)+' of a whole month of flexible money.');
  });
 }
 // wants share
 const tot=st.wants+st.needs;
 if(tot>0&&st.wants/tot>=0.6)misses.push(pct(st.wants/tot*100)+' of your logged spending was wants ('+money(st.wants)+'), against '+money(st.needs)+' of needs.');
 else if(tot>0&&st.wants/tot<=0.4)wins.push('Most of your spending went to needs ('+money(st.needs)+'), with wants at only '+money(st.wants)+'.');
 // small purchases
 const small=spendTx.filter(t=>t.amount<15);
 if(small.length>=6)misses.push(small.length+' purchases under $15 added up to '+money(small.reduce((a,t)=>a+t.amount,0))+'. They feel tiny one at a time.');
 // goals behind
 st.goalRows.forEach(r=>{
  if(r.p<=0)return;
  if(r.status==='done')wins.push('<b>'+esc(r.l.name)+'</b> is fully funded at '+money(r.a)+'.');
  else if(r.status==='behind'&&(mk<cur||prog>=0.7))misses.push('<b>'+esc(r.l.name)+'</b> only reached '+money(r.a)+' of the '+money(r.p)+' you planned.');
 });
 // wins
 const under=st.limitRows.filter(r=>r.p>0&&r.status!=='over'&&r.a<=r.p*0.85);
 if(under.length)wins.push('Under budget on '+under.slice(0,4).map(r=>'<b>'+esc(r.l.name)+'</b> ('+money(r.p-r.a)+' left)').join(', ')+'.');
 const spendDays=new Set(spendTx.map(t=>t.date));
 const daysSoFar=mk<cur?daysIn(mk):(mk===cur?new Date().getDate():0);
 const noSpend=daysSoFar-spendDays.size;
 if(daysSoFar>=5&&noSpend>=3)wins.push(noSpend+' days with no spending at all.');
 if(st.limitSpent<=st.limitPlanned&&spendTx.length)wins.push('Everyday spending stayed inside your '+money(st.limitPlanned)+' limit.');
 const cardPaid=S.debt.rows.filter(r=>String(r.date).indexOf(mk)===0).reduce((a,r)=>a+(+r.payment||0),0);
 if(cardPaid>0)wins.push('You put '+money(cardPaid)+' toward the credit card.');
 // tries
 const cof=txs.filter(t=>t.cat==='coffee');
 if(cof.length>=5){const avg=cof.reduce((a,t)=>a+t.amount,0)/cof.length;tries.push('You grabbed drinks '+cof.length+' times ('+money(cof.reduce((a,t)=>a+t.amount,0))+'). Skipping two a week keeps about '+money(avg*8)+' a month in your pocket, and you can still keep your favorite spot.');}
 const shop=txs.filter(t=>t.cat==='shopping');
 const shopSum=shop.reduce((a,t)=>a+t.amount,0);
 if(flexP>0&&shopSum>=flexP*0.5){
  const sg={};shop.forEach(t=>{const k=norm(t.desc);const g=sg[k]||(sg[k]={n:t.desc,s:0});g.s+=t.amount;});
  const top=Object.keys(sg).map(k=>sg[k]).sort((a,b)=>b.s-a.s).slice(0,3).map(g=>esc(g.n));
  tries.push('Shopping added up to '+money(shopSum)+(top.length?', mostly at '+top.join(', '):'')+'. Try a 24 hour wait on anything that is not on a list. If you still want it tomorrow, buy it, and most of the time you will not.');
 }
 if(flex&&flex.status==='over'&&flexP>0)tries.push('Pick a weekly fun cap of about '+money(flexP/4.3)+' and spend from that. If real life needs more, move the money on purpose in the Budget tab so the plan matches what you actually do.');
 const behind=st.goalRows.filter(r=>r.p>0&&r.status==='behind'&&mk>=cur);
 behind.slice(0,2).forEach(r=>{tries.push('Move '+money(r.p-r.a)+' to <b>'+esc(r.l.name)+'</b> right after payday, before anything else gets spent.');});
 if(!misses.length&&!tries.length&&under.length)tries.push('You have room to spare. Consider sending some of the leftover to the card instead of letting it drift into fun spending.');
 if(!tries.length)tries.push('Keep logging as you go. The more complete the log, the sharper this feedback gets.');
 return{st:st,wins:wins,misses:misses,tries:tries,empty:false};
}
function viewFeedback(){
 const f=feedback(month),st=f.st;
 const cur=todayStr().slice(0,7);
 const li=a=>a.length?'<ul class="fb">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="muted">Nothing here this month.</p>';
 let h='<div class="stack"><section class="card"><div class="row between wrapflex"><h2>'+monthLabel(month)+'</h2>'
 +(st.overall!=null?'<span class="muted">Budget match <b class="num" style="color:var(--text)">'+pct(st.overall)+'</b></span>':'')+'</div>'
 +(month===cur&&!f.empty?'<div class="banner" style="margin-top:12px">This month is not over yet, so this is a running read that updates as you log.</div>':'')+'</section>';
 if(f.empty){
  h+='<section class="card empty">Nothing logged for '+monthShort(month)+' yet. Add purchases in the Spending log and this page will tell you what went right, what slipped, and what to try next.</section>';
 }else{
  h+='<div class="two"><section class="card fbcol"><div class="head"><h2>What went well</h2></div>'+li(f.wins)+'</section>'
   +'<section class="card fbcol bad"><div class="head"><h2>What went off</h2></div>'+li(f.misses)+'</section></div>'
   +'<section class="card fbcol try"><div class="head"><h2>What to do better</h2></div>'+li(f.tries)+'</section>';
 }
 h+='<section class="card"><div class="head"><h2>My own notes</h2><span class="muted small">Saved for '+monthShort(month)+'</span></div>'
  +'<textarea data-scope="note" placeholder="What surprised you? What is the one thing you will change next month?" aria-label="My notes">'+esc(S.notes[month]||'')+'</textarea></section></div>';
 return h;
}

/* ---------- dialogs ---------- */
const dlg=document.getElementById('dlg');
function armed(btn,label,fn){
 if(btn.dataset.armed){fn();return;}
 btn.dataset.armed='1';const old=btn.textContent;btn.textContent=label;
 setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;}},3000);
}
function openDlg(title,body,opts){
 dlg.innerHTML='<form id="dform" class="dform"><h3>'+title+'</h3>'+body
  +'<div class="dact">'+(opts.onDelete?'<button type="button" class="btn ghost danger" id="dDelete">Delete</button>':'')
  +'<span class="sp"></span><button type="button" class="btn ghost" id="dCancel">Cancel</button><button type="submit" class="btn">Save</button></div></form>';
 const f=$('#dform',dlg);
 f.addEventListener('submit',ev=>{ev.preventDefault();if(opts.onSave()!==false)dlg.close();});
 $('#dCancel',dlg).addEventListener('click',()=>dlg.close());
 const del=$('#dDelete',dlg);
 if(del)del.addEventListener('click',()=>armed(del,'Tap again to delete',()=>{opts.onDelete();dlg.close();}));
 if(opts.after)opts.after();
 dlg.showModal();
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
function txDialog(id){
 const t=S.tx.find(x=>x.id===id);if(!t)return;
 const body='<label class="f"><span>What was it</span><input id="eDesc" value="'+esc(t.desc)+'"></label>'
 +'<div class="two" style="gap:10px"><label class="f"><span>Amount</span><div class="money"><span>$</span><input id="eAmt" inputmode="decimal" value="'+t.amount+'"></div></label>'
 +'<label class="f"><span>Date</span><input id="eDate" type="date" value="'+esc(t.date)+'"></label></div>'
 +'<div class="two" style="gap:10px"><label class="f"><span>Category</span><select id="eCat">'+S.cats.map(c=>'<option value="'+c.id+'"'+(c.id===t.cat?' selected':'')+'>'+esc(c.name)+'</option>').join('')+(catById(t.cat)?'':'<option value="'+esc(t.cat)+'" selected>Uncategorized</option>')+'</select></label>'
 +'<label class="f"><span>Type</span><select id="eNw"><option value="need"'+(t.nw==='need'?' selected':'')+'>Need</option><option value="want"'+(t.nw!=='need'?' selected':'')+'>Want</option></select></label></div>';
 openDlg('Edit purchase',body,{
  onSave:()=>{
   const a=parseFloat(String($('#eAmt').value).replace(/[$,\s]/g,''));
   if(!(a>0)){$('#eAmt').focus();return false;}
   Object.assign(t,{desc:$('#eDesc').value.trim(),amount:r2(a),date:$('#eDate').value||t.date,cat:$('#eCat').value,nw:$('#eNw').value});
   commit();renderView();toast('Saved');
  },
  onDelete:()=>{S.tx=S.tx.filter(x=>x.id!==id);commit();renderView();toast('Deleted');}
 });
}
function debtDialog(id){
 const r=S.debt.rows.find(x=>x.id===id);if(!r)return;
 const body='<label class="f"><span>Date</span><input id="rDate" type="date" value="'+esc(r.date)+'"></label>'
 +'<div class="two" style="gap:10px"><label class="f"><span>Payment</span><div class="money"><span>$</span><input id="rPay" inputmode="decimal" value="'+(+r.payment||0)+'"></div></label>'
 +'<label class="f"><span>Interest or fees</span><div class="money"><span>$</span><input id="rInt" inputmode="decimal" value="'+(+r.interest||0)+'"></div></label></div>';
 openDlg('Edit payment',body,{
  onSave:()=>{
   r.date=$('#rDate').value||r.date;
   r.payment=r2(parseFloat(String($('#rPay').value).replace(/[$,\s]/g,''))||0);
   r.interest=r2(parseFloat(String($('#rInt').value).replace(/[$,\s]/g,''))||0);
   commit();renderView();toast('Saved');
  },
  onDelete:()=>{S.debt.rows=S.debt.rows.filter(x=>x.id!==id);commit();renderView();toast('Deleted');}
 });
}

/* ---------- render ---------- */
function renderHeader(){
 $$('.tab').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 const nav=$('#months');if(!nav)return;
 nav.hidden=(tab==='debt'||tab==='members'||tab==='budget');
 const cur=todayStr().slice(0,7);
 const yr=+month.slice(0,4);
 let h='<button type="button" class="mtab yr" data-act="setyear" data-d="-1" aria-label="Previous year">&#8249;</button><span class="yrlab">'+yr+'</span><button type="button" class="mtab yr" data-act="setyear" data-d="1" aria-label="Next year">&#8250;</button>';
 for(let m=1;m<=12;m++){
  const mk=yr+'-'+pad(m);
  const lab=new Date(yr,m-1,1).toLocaleDateString('en-US',{month:'short'});
  h+='<button type="button" class="mtab'+(mk===cur?' now':'')+'" data-act="setmonth" data-m="'+mk+'" aria-pressed="'+(mk===month)+'" aria-label="'+monthLabel(mk)+(mk===cur?', this month':'')+'">'+lab+'</button>';
 }
 nav.innerHTML=h;
 const sel=nav.querySelector('[aria-pressed="true"]');
 if(sel&&sel.scrollIntoView&&!nav.hidden)try{sel.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
}
const VIEWS={overview:viewOverview,log:viewLog,budget:viewBudget,debt:viewDebt,members:viewMembers,track:viewTrack,feedback:viewFeedback};
function renderView(){
 const v=$('#view');if(!v)return;
 PL=(tab==='budget'||tab==='debt'||tab==='members')?S:planFor(month);
 v.innerHTML=(VIEWS[tab]||viewOverview)();
 if(tab==='log'){renderFilters();renderTxList();syncDraftUI();}
}
function renderAll(){renderHeader();renderView();}

/* ---------- events ---------- */
const ACTIONS={
 setyear:b=>{month=(+month.slice(0,4)+(+b.dataset.d))+'-'+month.slice(5,7);logFilter='all';renderAll();},
 setmonth:b=>{month=b.dataset.m;logFilter='all';renderAll();},
 pickcat:b=>{draft.cat=b.dataset.id;const c=catById(draft.cat);if(c)draft.nw=c.nw||'want';syncDraftUI();const a=$('#amt');if(a)a.focus();},
 nw:b=>{draft.nw=b.dataset.v;syncDraftUI();},
 filter:b=>{logFilter=b.dataset.id;renderFilters();renderTxList();},
 edittx:b=>txDialog(b.dataset.id),
 editdebt:b=>debtDialog(b.dataset.id),
 addmem:()=>memDialog(null),
 editmem:b=>memDialog(b.dataset.id),
 savenow:()=>{clearTimeout(saveTimer);try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}flush();toast('Saved');},
 addline:b=>{const g=b.dataset.g;S.lines.push({id:uid(),name:'New line',group:g,kind:g==='goals'?'goal':'limit',planned:0,note:''});commit();renderView();},
 delline:b=>armed(b,'Sure?',()=>{
  const id=b.dataset.id;const fb=lineById('flex')?'flex':(S.lines.find(l=>l.id!==id)||{}).id;
  S.cats.forEach(c=>{if(c.line===id)c.line=fb;});
  S.lines=S.lines.filter(l=>l.id!==id);commit();renderView();
 }),
 addcat:()=>{const first=S.lines.find(l=>l.kind==='limit')||S.lines[0];S.cats.push({id:uid(),name:'New category',line:first?first.id:'',nw:'want',color:PALETTE[S.cats.length%PALETTE.length]});commit();renderView();},
 delcat:b=>armed(b,'Sure?',()=>{
  const id=b.dataset.id;const fb=id!=='other'&&catById('other')?'other':null;
  if(fb)S.tx.forEach(t=>{if(t.cat===id)t.cat=fb;});
  S.cats=S.cats.filter(c=>c.id!==id);if(draft.cat===id)draft.cat=null;commit();renderView();
 }),
 export:async()=>{
  try{
   const dl=await window.claude.use('downloads');
   if(!dl){toast('Downloads are not available here');return;}
   await dl.save({filename:'budget-backup.json',data:JSON.stringify(S,null,2)});
  }catch(e){if(!e||e.code!=='declined')toast('Could not create the backup');}
 }
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-tab],[data-act]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;renderAll();window.scrollTo(0,0);return;}
 const fn=ACTIONS[b.dataset.act];if(fn)fn(b,e);
});
document.addEventListener('submit',e=>{
 if(e.target.id==='addform'){e.preventDefault();addTx();}
 else if(e.target.id==='debtform'){
  e.preventDefault();
  const pay=parseFloat(String($('#dPay').value).replace(/[$,\s]/g,''))||0;
  const it=parseFloat(String($('#dInt').value).replace(/[$,\s]/g,''))||0;
  if(!(pay>0||it>0)){$('#debtmsg').textContent='Enter a payment or an interest amount.';return;}
  S.debt.rows.push({id:uid(),ts:Date.now(),date:$('#dDate').value||todayStr(),payment:r2(pay),interest:r2(it)});
  commit();renderView();toast('Payment added');
 }
});
function applyField(t,isChange){
 const sc=t.dataset.scope;if(!sc)return;
 const f=t.dataset.f;
 if(sc==='income'){const v=t.value;S.income[f]=f==='override'?(v===''?null:(parseFloat(v)||0)):(parseFloat(v)||0);}
 else if(sc==='line'){
  const row=t.closest('[data-line-id]');const l=row&&lineById(row.dataset.lineId);if(!l)return;
  if(f==='planned')l.planned=parseFloat(t.value)||0;
  else if(f==='auto'){const rem=planned(l);if(t.checked)S.lines.forEach(x=>{x.auto=false;});else l.planned=rem;l.auto=t.checked;}
  else l[f]=t.value;
 }
 else if(sc==='cat'){const row=t.closest('[data-cat-id]');const c=row&&catById(row.dataset.catId);if(!c)return;c[f]=t.value;}
 else if(sc==='debtstart'){S.debt.start=parseFloat(t.value)||0;}
 else if(sc==='note'){S.notes[month]=t.value;}
 commit();
 if(tab==='budget')updateBudgetSummary();
 if(isChange&&(sc==='debtstart'||(sc==='line'&&(f==='kind'||f==='auto'||f==='name'))||(sc==='cat'&&f==='name')))renderView();
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.scope)applyField(e.target,false);});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='desc'){
  const k=norm(t.value);
  if(!draft.cat&&k){const m=S.tx.slice().reverse().find(x=>norm(x.desc)===k);if(m){draft.cat=m.cat;draft.nw=m.nw;syncDraftUI();}}
  return;
 }
 if(t.id==='importFile'){
  const f=t.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
   try{const d=JSON.parse(fr.result);if(!d||!d.lines||!d.cats)throw 0;S=migrate(d);commit();renderAll();toast('Backup restored');}
   catch(e){toast('That file is not a budget backup');}
  };
  fr.readAsText(f);t.value='';return;
 }
 if(t.dataset&&t.dataset.scope)applyField(t,true);
});

function flushNow(){clearTimeout(saveTimer);try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}flush();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow();});
window.addEventListener('pagehide',flushNow);
boot();
</script>
</body>
</html>
